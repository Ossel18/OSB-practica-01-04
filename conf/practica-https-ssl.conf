
<VirtualHost *:443>

    # Dominio de nuestra pagina
    ServerName DOMAIN_PLACEHOLDER

    # Directorio de la pagina web
    DocumentRoot /var/www/html

    # Archivo principal de la web
    DirectoryIndex index.php index.html

    # Activamos HTTPS
    SSLEngine on

    # Ruta del certificado
    SSLCertificateFile CERT_PATH_PLACEHOLDER

    # Ruta de la clave privada
    SSLCertificateKeyFile KEY_PATH_PLACEHOLDER

    # Archivo de errores
    ErrorLog ${APACHE_LOG_DIR}/practica-https-error.log

    # Archivo de accesos
    CustomLog ${APACHE_LOG_DIR}/practica-https-access.log combined

</VirtualHost>
