
<VirtualHost *:80>

    # Dominio de nuestra pagina
    ServerName DOMAIN_PLACEHOLDER

    # Carpeta donde se encuentra la web
    DocumentRoot /var/www/html

    # Activamos el modulo de redireccion
    RewriteEngine On

    # Redirigimos todas las peticiones HTTP a HTTPS
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

</VirtualHost>
